services:
  # ShadowBid dApp (static build + ZK artifacts)
  app:
    build: .
    ports:
      - '8080:80'
    restart: unless-stopped

  # Local proof server for ZK proof generation (used by wallets without
  # built-in proving, e.g. Lace; the 1AM wallet proves in-extension).
  proof-server:
    image: midnightntwrk/proof-server:8.1.0
    command: ['midnight-proof-server', '-v']
    ports:
      - '6300:6300'
    restart: unless-stopped

# Notes
# - Open the dApp at http://localhost:8080
# - Point VITE_PROOF_SERVER_URI at http://localhost:6300 when running the UI
#   outside Docker, or rely on wallet-provided proving with 1AM.
# - Contract deployment/calls additionally need a funded Midnight wallet on the
#   configured network (see README "Setup & Run Locally").
